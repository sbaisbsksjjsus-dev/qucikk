name = "qucikk"
compatibility_date = "2024-01-01"

[pages_build_output_dir]
# Cloudflare Pages will serve files from this directory
dir = "out"

[build]
# Build command for static export
command = "npm run build"
# Output directory after build
cwd = "."

# Environment variables (if needed)
[vars]
NODE_VERSION = "22"

# Optional: Custom domain or other settings
# [pages]
# url = "https://your-domain.pages.dev"